name: kr-oulad-access
services:
  access:
    build:
      context: .
      dockerfile: docker/access/Dockerfile
    image: kr-oulad-access:local
    init: true
    ports:
      - "127.0.0.1:${OULAD_ACCESS_PORT:-8010}:8000"
    environment:
      OULAD_ACCESS_MODE: ${OULAD_ACCESS_MODE:-live}
      OULAD_ACCESS_MODEL: ${OULAD_ACCESS_MODEL:-gemini-3.5-flash-lite}
      OULAD_ACCESS_MAX_REQUESTS: ${OULAD_ACCESS_MAX_REQUESTS:-10}
    secrets:
      - gemini_env
    volumes:
      - type: bind
        source: ./data/processed/oulad.ttl
        target: /inputs/oulad.ttl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ontology/education.rdfs.ttl
        target: /inputs/education.rdfs.ttl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./shapes/oulad-shapes.ttl
        target: /inputs/oulad-shapes.ttl
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./outputs/docker-access
        target: /app/outputs
    # Keep failures visible. A manual restart revalidates and resets the request cap.
    restart: "no"
secrets:
  gemini_env:
    file: ${OULAD_GEMINI_ENV_FILE:-../KRR/demos/.env}
